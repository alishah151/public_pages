name: Update hub index

on:
  push:
    branches: [main]
  workflow_dispatch:

# Commits made with GITHUB_TOKEN do not re-trigger workflows (no loop).
permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can push a follow-up commit cleanly
          fetch-depth: 0

      - name: Generate hub index
        run: node scripts/generate-hub-index.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh hub site list"
          git push
